library:
  name: "Test_library"
  general_info: "Whatever info you want to add about this library"
  container: "agustin"

# Should quality control analysis be done?
qctrl: False

# Reference genomes' paths
genomes:
    mm10: "/Volumes/hts_core/Shared/mus_musculus/mm10/bwa_0.7.12_indexed/mm10.fasta"
    mm10_f_d6: "/Volumes/Pezza/hpc-nobackup/References/Genomes/fusion_drodophila6_mm10/final_files/dm6_mm10_fusion.fa"
    mm10CAST_EiJ: "/Volumes/Pezza/hpc-nobackup/References/Genomes/fusion_drosophila_mm10cast/mm10.CAST_EiJ.fasta"
    mm10_x_CAST_EiJ: "/Volumes/Pezza/hpc-nobackup/References/Genomes/mm10_CAST_plus_B6/mm10_B6plusCAST.fasta"
    mm10_x_CAST_EiJ_f_d6: "/Volumes/Pezza/hpc-nobackup/References/Genomes/fusion_drosophila_mm10_CAST_plus_B6/d6_mm10_fusion.B6plusCAST.fasta"
    GRCh38: ""
    hg38: ""
    GRCh38_f_d6: ""

# suffix added to spike in chromosome-names
spike_in_suffixes:
  mm10_f_d6: "_d"
  GRCh38_f_d6: "_d"
  hg38_f_d6: "_d"
  mm10_x_CAST_EiJ_f_d6: "_d"

# suffix added to variant reference genome
variant_suffixes:
  CAST_EiJL: "_cast"

# MAPQ threshold
min_mapping_qual: "30" # To filter BAM files

# Coverage options
coverage:
  bin_size: "4" # The larger the bin, the smaller the file and the resolution
  smooth: "1" # number of base pairs to smooth, 1=no smooth
  extend_reads: "250" # How much to extend reads, for single read files only
  normalization: "CPM" # Options are CPM RPKM BPM None. Check bamcoverage from deeptools

# Peaks
MACS2:
  gsize: # Efective genome sizes according to MACS. This approximate and will not make a huge difference to have the actual number (which depends on the actual genome build and the read length and technology -SR or PE)
    hs: 2.7e9
    mm: 1.87e9
    ce: 9e7
    dm: 1.2e8
  broad_cutoff: "0.1" # 0.1 = MACS default.  This option is not available
  qvalue: "0.05" # 0.5 = MACS default
  control: # <techinque>_<species>_<frag._tech>_<library_tech>_<file_ID> # <chip|cyr|...>_<mm10_hg38...>_<sonic|mnase|...>_<accel|reg|...>_<1|2|...>
    no_input: ""
    chip_mm10_sonic_testes_regular_1: "/Volumes/Pezza/hpc-nobackup/Agustin/Lib3SMARCAD1HP1RPA_DiVa/Results/mm10/Bams/Both_strands/Input_11-6-19.mm10.q_filt.srt.nodup.mit_filt.bam"
    chip_mm10_sonic_testes_adaptase_1: "/Volumes/Pezza/hpc-nobackup/Agustin/Lib12_CHD4_BLM_HP1g/Results/mm10/Bams/Both_strands/2022_1_7_Input_zyg_MERGED.mm10.q_filt.srt.nodup.mit_filt.bam"
    chip_mm10_sonic_testes_adaptase_2: "/Volumes/Pezza/hpc-nobackup/Agustin/Lib16_CyRs_Msh4_RPA-HP1s-KO_CHD4/3rd_deposit_of_data/Results/mm10/Bams/Both_strands/6-28-22_MSH4_8_di_laZYG_RMI2_WT.mm10.q_filt.srt.nodup.mit_filt.bam"
    chip_mm10_MNAse_testes_adaptase_7dpp: "/Volumes/Pezza/hpc-nobackup/Agustin/Lib12_CHD4_BLM_HP1g/Merged_files/Nodup/MitDel/2022_1_28_input_7dpp_MNAse_merged.filt.srt.nodup._filt.chr.bam"
    cyr_mm10_testes_adaptase_1: "/Volumes/Pezza/hpc-nobackup/Agustin/Lib14_H2az_H33_CyR_dmc1ko/Processed_old_way/Merged_files/Nodup/MitDel/RaG_IgG_merge_R4_and_R7_from_3-22_and_3-24_2022.filt.srt.nodup._filt.chr.bam"
    chip_mm10_sonic_testes_adaptase_7dpp: "/Volumes/Pezza/hpc-nobackup/Agustin/Lib12_CHD4_BLM_HP1g/Processed_old_way/Merged_files/Nodup/MitDel/2022_1_24_input_7dpp_sonic_merged.filt.srt.nodup._filt.chr.bam"
  # Single read arguments
  extension: "300"

# Bed files
references:
  mm10:
    spo11:
      top_5000_plus_minus_2000: "Resources/bed_files/SPO11_B6_mm10_GSE84689_Chr_BL_GRlst_filt_hits_desc_TOP_5000_center_plus_minus_2000.bed"
      all_plus_minus_2000: "Resources/bed_files/SPO11_B6_mm10_GSE84689_Chr_BL_GRlst_filt_hits_desc_center_plus_inus_2000.bed"
      asymetric_watson_strong: "Resources/bed_files/asymetric_hotspots_watson_strong.bed"
      asymetric_crick_strong: "Resources/bed_files/asymetric_hotspots_crick_strong.bed" 
      symetric_all: ""
      symetric_asym_ctrl: ""
      x_non_par: "Resources/bed_files/SPO11_X-nonPAR-GSE84689_B6_mm10_BL_GRlst_filt_hits_desc_center.bed"
      autosomal_all: ""
      autosomal_x_non_par_ctrl: "Resources/bed_files/SPO11_autosomal-MATCHED-TO-X_non_PAR-GSE84689_B6_mm10_BL_GRlst_filt_hits_desc_center.bed"
    dmc1:
      B6xCAST_top_5000_pm_1000bp: "Resources/bed_files/B6xCAST_CASTxB6_common_HSs_autosomal_top_5000.bed"
      B6xCAST_PRDM9_assymetric_hs_invading_strand: "Resources/bed_files/PRDM9_assymetric.autosomal.invading.dmc1_coords.bed"
      B6xCAST_PRDM9_assymetric_hs_receiving_strand: "Resources/bed_files/PRDM9_assymetric.autosomal.receiving.dmc1_coords.bed"
      B6xCAST_PRDM9_assymetric_hs_mm10_aligned: "Resources/bed_files/PRDM9_assymetric.autosomal.mm10.dmc1_coords.bed"
    TSS: ""
    blacklist: "Resources/bed_files/mm10.blacklist_merge1000.bed"
    black_grey: "Resources/bed_files/GREYLIST_PE150_ZYG_sonic_ACELL.bed"
  #     sonic:
  #       PE_adaptase: ""
  #     MNAse:
  #       PE_adaptase: ""
  hg38:
    spo11:
      top_5000_plus_minus_2000: ""
      all_plus_minus_2000: ""
    TSS: ""
    blacklist: ""
    black_grey: ""

heatmaps:
  before_region: "3000"
  after_region: "3000"
  bin_size: "2"

aggregate_profiles:
  process_outfile:
    overwrite: "TRUE"
    smooth: "TRUE"

######################
#### ENV. MODULES ####
######################

sambamba: "sambamba/0.8.2"
fastp: "fastp/0.23.2"
bwa: "bwa/0.7.15"
samtools: "samtools/1.14"
picard: "picard/2.21.2"
deeptools: "deeptools/3.4.3"
multiqc: "multiqc/1.8"
bedtools: "bedtools/2.30.0"
homer: "homer/4.7"
R: "R/4.1.2-mkl"
bioconductor: "bioconductor/3.14"
phantompeakqualtools: "phantompeakqualtools/1.2"
macs2: "macs2/2.2.7.1"
bamutil: "bamutil/1.0.15"

