---
executor: slurm
default-resources:
  slurm_account: "pezzar-lab"
  slurm_partition: "serial"
  slurm_extra: "'--mail-type=FAIL'"
  runtime: "10h"
  mem_mb: 2000
use-envmodules: "True"
restart-times: "1"
max-jobs-per-second: "20"
max-status-checks-per-second: "10"
local-cores: 1
latency-wait: "60"
use-conda: "False"
use-singularity: "False"
jobs: "100"
printshellcmds: "True"
keep-going: "True"

set-threads:
  - align_fastq=12
  - call_peaks_macs2=2
  - clip_1bp=2
  - compute_matrix_outfiles_hs=4
  - create_coverage_bw=12
  - dedup_bam=2
  - dros_normalization=12
  - dros_normalization_report=1
  - filter_peaks_blk_grey_list=1
  - filter_spiked_in_bam_int_genome=8
  - filter_spiked_in_bam_spike_in_genome=8
  - filter_bam=8
  - FRIP=2
  - generate_checksums=2
  - get_strand_sep_bams=2
  - index=2
  - insert_size_picard=2
  - intersect_peaks_HSs_list=1
  - library_complexity_picard=2
  - markdown_report_aggregate_profiles=1
  - merge_bams=2
  - merge_watson_or_crick=2
  - multiqc=2
  - process_aggregate_profiles=1
  - process_aggregate_profiles_clipped=1
  - plot_heatmaps=1
  - samtools_flagstat=2
  - samstats=2
  - summarize_peak_count=1
  - trim_adapters_SE=6
  - trim_adapters_PE=6
  - trim_adaptase=4
  - wrangle_X_nonPAR_asymmetric_HS=1

set-resources:
    align_fastq:
      mem_mb: 31000
      runtime: "max(int(((input.size_mb - 1900) / 50) * attempt), 150)"
    call_peaks_macs2:
      mem_mb: 9000
    clip_1bp:
      mem_mb: 2900
    compute_matrix_outfiles_hs:
      mem_mb: 4000
    create_coverage_bw:
      mem_mb: 10000
    dedup_bam:
      mem_mb: 7600
    dros_normalization:
      mem_mb: 10000
    filter_bam:
      mem_mb: 800
    filter_spiked_in_bam_int_genome:
      mem_mb: 55000
    filter_spiked_in_bam_spike_in_genome:
      mem_mb: 55000
    FRIP:
      mem_mb: 2000
    generate_checksums:
      mem_mb: 2000
      runtime: "60"
    get_strand_sep_bams:
      mem_mb: 1000
    index:
      mem_mb: 800
    insert_size_picard:
      mem_mb: 1200
    library_complexity_picard:
      mem_mb: "int(input.size_mb * 0.5 + 6500)"
    merge_bams:
      mem_mb: 800
    merge_watson_or_crick:
      mem_mb: 700
    multiqc:
      mem_mb: 800
    process_aggregate_profiles:
      mem_mb: "int(input.size_mb + 2000)"
    samstats:
      mem_mb: 310
    samtools_flagstat:
      mem_mb: 310
    trim_adaptase:
      mem_mb: 800
    trim_adapters_SE:
      mem_mb: 5000
    trim_adapters_PE:
      mem_mb: 5000
